# ==============================================================================
# IRS-HVUT v1.1 - Production Nginx Reverse Proxy Configuration
# Compliant with IRS Pub 4164 / NIST SP 800-52 Rev. 2 / PCI-DSS v4.0
# ==============================================================================

# Connection upgrade mapping for WebSocket support (Next.js HMR / Realtime updates)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Define Node.js / Next.js upstream application cluster
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Rate limiting zones to protect authentication, filing, and payment APIs
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80) -> Redirect All Traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # ACME Challenge Directory for Let's Encrypt / Certbot automated renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 301 Permanent Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443) -> Secure SSL / TLS Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # --------------------------------------------------------------------------
    # SSL / TLS Certificate Configuration (Let's Encrypt)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # Diffie-Hellman parameter for Forward Secrecy (Generate via: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Modern TLS Protocols Only (Enforce TLS 1.2 and TLS 1.3, deprecate TLS 1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;

    # High-security cipher suites (PFS, AEAD / GCM, NIST SP 800-52 compliant)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    # OCSP Stapling (Speeds up SSL handshake and verifies revocation with CA)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Security Headers (Federal Tax & Banking Compliance)
    # --------------------------------------------------------------------------
    # HTTP Strict Transport Security (HSTS - 2 Years with subdomains and preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent Clickjacking / framing attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Referrer policy for external payment and verification gateways
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict dangerous browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://js.stripe.com')" always;

    # Content Security Policy (Allows Next.js scripts, Stripe Elements, and inline fonts)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; connect-src 'self' https://api.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # --------------------------------------------------------------------------
    # Request & Upload Buffer Tuning
    # --------------------------------------------------------------------------
    # Allow up to 25MB request body for bulk fleet CSV / Excel imports and PDF documents
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Access and Error Logs
    access_log /var/log/nginx/irs-hvut-access.log;
    error_log /var/log/nginx/irs-hvut-error.log warn;

    # --------------------------------------------------------------------------
    # Static Assets & Caching (Next.js Optimized)
    # --------------------------------------------------------------------------
    # Cache Next.js immutable bundles for 1 year
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files (logos, favicons, forms)
    location ~* ^/(favicon\.ico|robots\.txt|images/|forms/|app-screens/) {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # Rate-Limited Sensitive Endpoints (Brute-Force Protection)
    # --------------------------------------------------------------------------
    location /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Main Next.js Application Proxy
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=100 nodelay;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts: Extended to 120s to allow for IRS MeF A2A SOAP transmissions and Stripe charges
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
}
