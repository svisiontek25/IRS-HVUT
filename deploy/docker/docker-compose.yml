# ==============================================================================
# IRS-HVUT v1.1 - Docker Compose Production Stack
# Services: Next.js Web App + Nginx Reverse Proxy + Let's Encrypt Certbot
# ==============================================================================

version: '3.8'

services:
  # Next.js Application Container
  app:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: irs-hvut-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      - irs_data:/app/data
    networks:
      - hvut-network
    expose:
      - "3000"

  # Nginx Reverse Proxy Container with HTTP/2 and SSL Termination
  nginx:
    image: nginx:1.25-alpine
    container_name: irs-hvut-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/irs-hvut.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - hvut-network

  # Certbot Automated SSL Certificate Manager
  certbot:
    image: certbot/certbot:latest
    container_name: irs-hvut-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - hvut-network

volumes:
  irs_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  hvut-network:
    driver: bridge
