name: Build & Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script_stop: true
          script: |
            # Navigate to application directory
            APP_DIR="${{ secrets.HOSTINGER_APP_DIR || '/var/www/irs-hvut' }}"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "Error: Directory $APP_DIR does not exist. Please run initial server setup first."
              exit 1
            fi

            cd "$APP_DIR"

            echo " Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing production dependencies..."
            npm ci

            echo "🔨 Building Next.js application..."
            npm run build

            echo "🚀 Reloading PM2 process..."
            if pm2 describe irs-hvut > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save

            echo "✅ Deployment completed successfully!"
